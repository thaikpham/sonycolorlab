<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Film Simulation App</title>

<!-- PWA and Add to Home Screen Configuration -->
<link rel="icon" type="image/png" href="/assets/Logo.png">
<link rel="apple-touch-icon" href="/assets/Logo.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="white">
<meta name="apple-mobile-web-app-title" content="ColorLAB">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/manifest.json">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"></noscript>

<link rel="stylesheet" href="/src/styles/style.css">

</head>
<body class="antialiased">
<div id="loading-overlay" class="loading-overlay hidden">
  <div class="spinner"></div>
  <p data-translate-key="loadingMessage">Đang tải...</p>
</div>
<div id="blobContainer" class="fixed inset-0 -z-10 overflow-hidden"></div>

<div id="appContainer" class="min-h-screen w-screen flex flex-col">
    <!-- Updated Header: Added md:pl-[336px] lg:pl-[calc(25%+16px)] to offset the fixed sidebar -->
    <header id="appHeader" class="flex justify-between items-center w-full z-20 flex-shrink-0 p-4 md:pl-[336px] lg:pl-[calc(25%+16px)] transition-all duration-300">
        <!-- Header content will be rendered by ui.js -->
    </header>
    <main id="mainContent" class="flex-grow min-h-0 relative"></main>
</div>

<div id="infoTooltip" class="hidden"></div>

<div id="lightbox" class="hidden">
    <span id="lightboxClose">&times;</span>
    <div id="lightboxPrev" class="lightbox-arrow">&#x2039;</div>
    <img id="lightboxImage" src="" alt="Full size view">
    <div id="lightboxNext" class="lightbox-arrow">&#x203A;</div>
    <div id="lightboxCounter"></div>
</div>

<div id="quizModal" class="modal hidden fixed inset-0 bg-black/30 backdrop-blur-md z-50 flex items-center justify-center p-4 md:pr-[160px]">
    <div id="quizPanel" class="modal-panel w-full max-w-7xl max-h-[90vh] flex flex-col rounded-2xl md:rounded-3xl !bg-gray-100/70 relative">
        <button id="closeQuizBtn" class="absolute top-4 right-5 text-3xl font-light text-gray-400 hover:text-black z-10">&times;</button>
        <div id="quizContent" class="p-4 md:p-6 flex-grow overflow-y-auto sleek-scrollbar"></div>
    </div>
</div>

<div id="aiLabModal" class="modal hidden fixed inset-0 bg-black/30 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div id="aiLabPanel" class="modal-panel w-full max-w-4xl max-h-[90vh] flex flex-col rounded-2xl">
        <div class="flex justify-between items-center p-5 border-b border-gray-200 flex-shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center shadow-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.25a.75.75 0 0 1 .75.75v2.25a.75.75 0 0 1-1.5 0V3a.75.75 0 0 1 .75-.75ZM7.5 12a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0Zm12.25-3.625a.75.75 0 0 0-1.06-1.06l-1.592 1.591a.75.75 0 1 0 1.06 1.061l1.592-1.591ZM21 12a.75.75 0 0 1-.75.75h-2.25a.75.75 0 0 1 0-1.5h2.25a.75.75 0 0 1 .75.75ZM17.81 17.81a.75.75 0 0 0-1.06-1.06l-1.591 1.592a.75.75 0 0 0 1.06 1.06l1.591-1.592ZM12 18.75a.75.75 0 0 1 .75.75v2.25a.75.75 0 0 1-1.5 0V19.5a.75.75 0 0 1 .75-.75ZM4.19 17.81a.75.75 0 1 0-1.06-1.06l-1.591 1.592a.75.75 0 0 0 1.06 1.06l1.591-1.592ZM3 12a.75.75 0 0 1 .75-.75h2.25a.75.75 0 0 1 0-1.5H3.75A.75.75 0 0 1 3 12ZM4.19 6.19a.75.75 0 0 0 1.06-1.06L3.657 3.536a.75.75 0 0 0-1.06 1.06l1.592 1.592Z" /></svg>
                </div>
                 <h2 class="text-xl font-bold" data-translate-key="aiLabTitle"></h2>
            </div>
            <button id="closeAILabBtn" class="text-3xl font-light text-gray-400 hover:text-black">&times;</button>
        </div>
        <div id="aiLabContent" class="p-6 md:p-8 flex-grow overflow-y-auto sleek-scrollbar">
        </div>
    </div>
</div>

<div id="contributionNoteModal" class="modal hidden fixed inset-0 bg-black/30 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div id="contributionNotePanel" class="modal-panel w-full max-w-lg flex flex-col rounded-2xl">
        <div class="flex justify-between items-center p-5 border-b border-gray-200">
            <h2 class="text-xl font-bold" data-translate-key="contributeNoteTitle"></h2>
            <button id="closeContributionNoteBtn" class="text-3xl font-light text-gray-400 hover:text-black">&times;</button>
        </div>
        <div class="p-6 md:p-8">
            <p class="text-gray-600 leading-relaxed" data-translate-key="contributeNoteText"></p>
        </div>
        <div class="p-5 bg-gray-50 border-t border-gray-200 rounded-b-2xl flex flex-col sm:flex-row justify-end gap-3">
             <button id="closeContributionNoteBtn2" class="btn bg-gray-200 text-gray-800 py-2 px-6" data-translate-key="aiCancelBtn"></button>
             <a href="#" target="_blank" rel="noopener noreferrer" id="proceedToGooglePhotosBtn" class="btn btn-primary py-2 px-6">
                <span data-translate-key="contributeNoteProceedBtn"></span>
             </a>
        </div>
    </div>
</div>

<!-- SCRIPT IMPORTS -->
<script type="module" src="/src/app.js"></script>

</body>
</html>
